<div class="container-fluid">
  <div class="d-flex justify-content-between align-items-start mb-4 flex-wrap gap-3">
    <div>
      <h1 class="h3 fw-bold text-dark mb-2">Products Management</h1>
      <p class="text-muted mb-0">Configure and manage your organization's product catalog.</p>
    </div>
  </div>

  <div class="card border-0 shadow-sm mb-4">
    <div class="card-body">
      <div class="row g-3 align-items-center">
        <div class="col-12">
          <div class="input-group">
            <span class="input-group-text bg-transparent border-end-0 text-secondary">
              <i class="bi bi-search"></i>
            </span>
            <input
              type="text"
              class="form-control border-start-0"
              placeholder="Search by product name or description..."
              [(ngModel)]="searchQuery"
              (change)="onSearchChange()"
            />
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="card border-0 shadow-sm mb-4">
    <div class="table-responsive">
      <table class="table table-hover align-middle mb-0">
        <thead class="table-light">
          <tr>
            <th class="fw-semibold text-uppercase small text-muted">
              <button type="button" class="btn btn-link p-0 text-decoration-none text-muted fw-semibold small text-uppercase" (click)="sortBy('name')">
                Product Info
                <i class="bi ms-1" [ngClass]="sortColumn === 'name' ? (sortDirection === 'asc' ? 'bi-arrow-up' : 'bi-arrow-down') : 'bi-arrow-down-up'"></i>
              </button>
            </th>
            <th class="fw-semibold text-uppercase small text-muted">
              <button type="button" class="btn btn-link p-0 text-decoration-none text-muted fw-semibold small text-uppercase" (click)="sortBy('description')">
                Description
                <i class="bi ms-1" [ngClass]="sortColumn === 'description' ? (sortDirection === 'asc' ? 'bi-arrow-up' : 'bi-arrow-down') : 'bi-arrow-down-up'"></i>
              </button>
            </th>
          </tr>
        </thead>
        <tbody>
          <tr *ngIf="isLoading">
            <td colspan="2" class="text-center text-muted py-4">Loading products...</td>
          </tr>
          <tr *ngFor="let product of paginatedProducts">
            <td>
              <div class="fw-semibold text-dark">{{ product.name }}</div>
            </td>
            <td>
              {{ product.description }}
            </td>
          </tr>
          <tr *ngIf="!isLoading && !errorMessage && paginatedProducts.length === 0">
            <td colspan="2" class="text-center text-muted py-4">No products match your search.</td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="card-footer bg-light border-top">
      <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
        <small class="text-muted">
          Showing {{ products.length }} of {{ totalCount }} products
        </small>
        <nav aria-label="Products pagination">
          <ul class="pagination pagination-sm mb-0">
            <li class="page-item" [ngClass]="{ disabled: currentPage === 1 }">
              <button
                type="button"
                class="page-link"
                (click)="previousPage()"
                [disabled]="currentPage === 1"
                aria-label="Previous page"
              >
                <i class="bi bi-chevron-left"></i>
              </button>
            </li>
            <li class="page-item disabled">
              <span class="page-link border-0 bg-transparent text-muted">
                Page {{ currentPage }} of {{ totalPages || 1 }}
              </span>
            </li>
            <li class="page-item" [ngClass]="{ disabled: currentPage >= totalPages }">
              <button
                type="button"
                class="page-link"
                (click)="nextPage()"
                [disabled]="currentPage >= totalPages"
                aria-label="Next page"
              >
                <i class="bi bi-chevron-right"></i>
              </button>
            </li>
          </ul>
        </nav>
      </div>
    </div>
  </div>
</div>
